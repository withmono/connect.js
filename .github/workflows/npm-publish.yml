name: npm-publish
on:
  # Publish only on explicit version tags (or manual dispatch), never on
  # every push, so a stray commit to develop cannot ship to the npm registry.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and Publish Project
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish project
        run: npm publish --access public
